services:
  budget:
    image: ghcr.io/OWNER/REPO:latest
    # Or build locally instead of pulling:
    # build: .
    container_name: budget
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_PATH: /data/budget.sqlite
      ALLOW_REGISTRATION: "true"
      ORIGIN: http://localhost:3000
    volumes:
      - budget-data:/data

volumes:
  budget-data:
