services:
  tally:
    image: ghcr.io/tally-app/tally:latest
    # Or build locally instead of pulling:
    # build: .
    container_name: tally
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_PATH: /data/tally.sqlite
      ALLOW_REGISTRATION: "true"
      ORIGIN: http://localhost:3000
    volumes:
      - tally-data:/data

volumes:
  tally-data:
