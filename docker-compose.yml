services:
  tally:
    image: ghcr.io/thatguy-za/tally:latest
    # Or build locally instead of pulling:
    # build: .
    container_name: tally
    restart: unless-stopped
    # host:container — the container port is 3000 (set by the image)
    ports:
      - "3000:3000"
    environment:
      ALLOW_REGISTRATION: "true"
      # Direct access (http://<host>:3000) needs no extra config. Behind a
      # reverse proxy, set ORIGIN to the public URL, e.g.:
      # ORIGIN: https://tally.example.com
      # (or pass through X-Forwarded-Proto / X-Forwarded-Host from the proxy)
    volumes:
      - tally-data:/data

volumes:
  tally-data:
