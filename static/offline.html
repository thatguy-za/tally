<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're offline · Tally</title>
  <meta name="theme-color" content="#f6f3ec" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      text-align: center;
      background: #f6f3ec;
      color: #16150f;
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #16150f; color: #f6f3ec; }
    }
    .mark { width: 48px; height: 48px; }
    h1 { font-size: 17px; margin: 0; }
    p { margin: 0; opacity: 0.65; max-width: 32ch; }
    button {
      margin-top: 8px;
      border: 1px solid currentColor;
      background: transparent;
      color: inherit;
      padding: 8px 16px;
      border-radius: 8px;
      font: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <img class="mark" src="/icon.svg" width="48" height="48" alt="" />
  <h1>You're offline</h1>
  <p>Tally couldn't reach the server. Check your connection and try again.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
